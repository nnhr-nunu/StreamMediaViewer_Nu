[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-media-viewer"
version = "0.1.0"
description = "配信者向け安全写真・動画ビューワー StreamMediaViewer(ぬ)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "PySide6>=6.7.0",
  "opencv-python>=4.10.0",
  "mediapipe>=0.10.14",
  "Pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-qt>=4.4.0",
  "ruff>=0.6.0",
  "pyinstaller>=6.10.0",
]

[project.scripts]
stream-media-viewer = "stream_media_viewer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
