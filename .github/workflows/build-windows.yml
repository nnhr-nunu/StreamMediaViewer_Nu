name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: >
          pyinstaller --noconfirm --clean --windowed --name StreamMediaViewer
          --collect-all mediapipe --collect-all PySide6
          --add-data "src/stream_media_viewer/assets;stream_media_viewer/assets"
          src/stream_media_viewer/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: StreamMediaViewer-windows
          path: dist/StreamMediaViewer
