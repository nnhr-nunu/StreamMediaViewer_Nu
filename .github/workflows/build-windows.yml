name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - name: Test
        env:
          PYTHONFAULTHANDLER: "1"
        run: pytest -q --tb=short
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name StreamMediaViewer
          --icon src/stream_media_viewer/assets/app_icon.ico
          --version-file packaging/windows_version.txt
          --collect-all mediapipe --collect-all PySide6
          --hidden-import PySide6.QtMultimedia
          --add-data "src/stream_media_viewer/assets;stream_media_viewer/assets"
          src/stream_media_viewer/__main__.py
      - run: Copy-Item packaging/HOW_TO_RUN.txt dist/StreamMediaViewer/使いかた.txt
      - run: Compress-Archive -Path dist/StreamMediaViewer/* -DestinationPath StreamMediaViewer-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: StreamMediaViewer-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - name: Test
        env:
          PYTHONFAULTHANDLER: "1"
        run: python scripts/ci_macos_pytest.py
      - name: Build app
        run: >
          pyinstaller --noconfirm --clean --windowed --name StreamMediaViewer
          --icon src/stream_media_viewer/assets/app_icon.png
          --collect-all mediapipe --collect-all PySide6
          --hidden-import PySide6.QtMultimedia
          --add-data "src/stream_media_viewer/assets:stream_media_viewer/assets"
          src/stream_media_viewer/__main__.py
      - name: Zip
        run: |
          cp packaging/HOW_TO_RUN.txt dist/HOW_TO_RUN.txt
          cd dist
          if [ -d StreamMediaViewer.app ]; then
            zip -r ../StreamMediaViewer-macOS.zip StreamMediaViewer.app HOW_TO_RUN.txt
          else
            zip -r ../StreamMediaViewer-macOS.zip StreamMediaViewer HOW_TO_RUN.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: StreamMediaViewer-macOS.zip

  release:
    needs: [windows, macos]
    if: needs.windows.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Remove obsolete generic asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset latest StreamMediaViewer.zip --yes || true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版（展開して起動）
          body: |
            ## ダウンロード手順

            1. このページ下部の **Assets** を開く
            2. Windows は **StreamMediaViewer-windows.zip**、Mac は **StreamMediaViewer-macOS.zip** をダウンロード
            3. ダウンロードした zip を展開
            4. Windows は `StreamMediaViewer.exe`、Mac は `StreamMediaViewer.app`（または `StreamMediaViewer`）を開く

            OS と違う zip は使わないでください。

            詳しい使い方はリポジトリの README を見てください。
          files: |
            windows-zip/StreamMediaViewer-windows.zip
            macos-zip/StreamMediaViewer-macOS.zip
          fail_on_unmatched_files: true
          make_latest: true
