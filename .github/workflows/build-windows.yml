name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - name: Test
        env:
          PYTHONFAULTHANDLER: "1"
        run: pytest -q --tb=short
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name StreamMediaViewer
          --icon src/stream_media_viewer/assets/app_icon.ico
          --version-file packaging/windows_version.txt
          --collect-all mediapipe --collect-all PySide6
          --hidden-import PySide6.QtMultimedia
          --add-data "src/stream_media_viewer/assets;stream_media_viewer/assets"
          src/stream_media_viewer/__main__.py
      - run: Copy-Item packaging/HOW_TO_RUN.txt dist/StreamMediaViewer/使いかた.txt
      - run: Compress-Archive -Path dist/StreamMediaViewer/* -DestinationPath StreamMediaViewer-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: StreamMediaViewer-windows.zip

  macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos-zip
            zip: StreamMediaViewer-macOS.zip
          - os: macos-15-intel
            artifact: macos-intel-zip
            zip: StreamMediaViewer-macOS-intel.zip
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Show CPU
        run: uname -m
      - run: python -m pip install -U pip
      - run: python scripts/ci_macos_install.py
      - name: Confirm macOS 12 libraries
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import numpy

          pyside = version("PySide6")
          cv = version("opencv-python")
          print("PySide6", pyside)
          print("opencv-python", cv)
          print("numpy", numpy.__version__, numpy.__file__)

          def major_minor(value):
              parts = value.split(".")
              return int(parts[0]), int(parts[1])

          if major_minor(pyside) >= (6, 10):
              raise SystemExit("PySide6 must stay below 6.10 for macOS 12")
          if major_minor(cv) >= (4, 11):
              raise SystemExit("opencv-python must stay below 4.11 for macOS 12")
          PY
      - name: Test
        env:
          PYTHONFAULTHANDLER: "1"
        run: python scripts/ci_macos_pytest.py
      - name: Build app
        run: >
          pyinstaller --noconfirm --clean --windowed --name StreamMediaViewer
          --icon src/stream_media_viewer/assets/app_icon.png
          --exclude-module mediapipe
          --exclude-module PySide6.QtWebEngine
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.Qt3DCore
          --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtQml
          --hidden-import PySide6.QtMultimedia
          --add-data "src/stream_media_viewer/assets:stream_media_viewer/assets"
          src/stream_media_viewer/__main__.py
      - name: Confirm app CPU
        run: |
          bin="dist/StreamMediaViewer.app/Contents/MacOS/StreamMediaViewer"
          if [ ! -f "$bin" ]; then
            bin="dist/StreamMediaViewer/StreamMediaViewer"
          fi
          file "$bin"
          lipo -info "$bin" || true
      - name: Confirm macOS 12 binaries
        run: python scripts/ci_macos_minos.py
      - name: Zip
        run: |
          cp packaging/HOW_TO_RUN.txt dist/HOW_TO_RUN.txt
          cd dist
          if [ -d StreamMediaViewer.app ]; then
            zip -r "../${{ matrix.zip }}" StreamMediaViewer.app HOW_TO_RUN.txt
          else
            zip -r "../${{ matrix.zip }}" StreamMediaViewer HOW_TO_RUN.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.zip }}

  release:
    needs: [windows, macos]
    if: needs.windows.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Remove obsolete generic asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset_id=$(gh api "repos/${GH_REPO}/releases/tags/latest" --jq '.assets[] | select(.name=="StreamMediaViewer.zip") | .id' || true)
          if [ -n "${asset_id}" ]; then
            gh api --method DELETE "repos/${GH_REPO}/releases/assets/${asset_id}"
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版（展開して起動）
          body: |
            ## ダウンロード手順

            1. このページ下部の **Assets** を開く
            2. 下の表の zip をダウンロードする
            3. ダウンロードした zip を展開する
            4. Windows は `StreamMediaViewer.exe`、Mac は `StreamMediaViewer.app` を開く（無いときは `StreamMediaViewer`）

            Mac で `StreamMediaViewer.exe` だけが見えるときは、Windows 用の zip です。窓は出ません。

            | PC | ダウンロードするファイル |
            | -- | ------------ |
            | Windows | `StreamMediaViewer-windows.zip` |
            | Mac（M1 / M2 / M3 など Apple チップ） | `StreamMediaViewer-macOS.zip` |
            | Mac（Intel。2016 の MacBook Pro など） | `StreamMediaViewer-macOS-intel.zip` |

            どれか分からないときは、左上のリンゴマーク → **この Mac について** を見てください。「チップ」が Apple なら `macOS.zip`、「プロセッサ」が Intel なら `macOS-intel.zip` です。

            ## 起動時の警告（署名していないため出ます）

            ウイルスではありません。このソフトはストア経由ではないので、OS が初回だけ止めます。

            **Windows** 「WindowsによってPCが保護されました」などと出たら:

            1. **詳細情報** を開く
            2. **実行** を選ぶ

            **Mac** 「開発元を確認できないため開けません」と出たら:

            1. アプリを **右クリック** して **開く**
            2. 確認が出たらもう一度 **開く**
            3. まだダメなら **システム設定 → プライバシーとセキュリティ** で許可する

            「このアプリケーションはこの Mac ではサポートされていない」と出たら、zip を間違えています。Intel の Mac は **StreamMediaViewer-macOS-intel.zip** を使ってください。

            `.exe` を開いても何も出ないときは、Windows 用です。Mac は **StreamMediaViewer.app** を右クリックして **開く** してください。

            詳しい使い方はリポジトリの README を見てください。
          files: |
            windows-zip/StreamMediaViewer-windows.zip
            macos-zip/StreamMediaViewer-macOS.zip
            macos-intel-zip/StreamMediaViewer-macOS-intel.zip
          fail_on_unmatched_files: true
          make_latest: true
